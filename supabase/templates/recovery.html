<!doctype html>
<meta charset="utf-8">
<div style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#F3ECDF;padding:32px 16px;">
  <div style="max-width:460px;margin:0 auto;background:#FFFCF5;border-radius:20px;padding:32px;">
    <div style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#7A7266;">Inkwit</div>
    <h1 style="font-size:26px;line-height:1.15;margin:8px 0 14px;color:#2B261F;">Nové heslo</h1>
    <p style="color:#4A443C;line-height:1.55;margin:0 0 22px;">
      Někdo (nejspíš ty) si řekl o nové heslo k Inkwitu. Klikni na tlačítko a nastav si ho.
      Odkaz je jednorázový a po chvíli vyprší.
    </p>
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery"
       style="display:inline-block;background:#52633A;color:#FFFCF5;text-decoration:none;
              padding:14px 26px;border-radius:14px;font-weight:600;">
      Nastavit nové heslo
    </a>
    <p style="color:#7A7266;font-size:13px;line-height:1.5;margin:22px 0 0;">
      Pokud sis o nic neřekl, nic nedělej — heslo zůstane, jaké bylo.
    </p>
  </div>
</div>
